[runtime]
name = "apple-container"
minimum_host_arch = "arm64"
default_container = "adputate-pihole"

[identity]
display_name = "Adputate"
cli_name = "adputate"
service_label = "com.adputate.pihole"

[pihole]
image = "pihole/pihole:2026.07.2"
platform = "linux/arm64"
cpus = 1
memory = "256M"

[ports.local]
admin_tcp = "127.0.0.1:8080:80/tcp"
dns_tcp = "127.0.0.1:5053:53/tcp"
dns_udp = "127.0.0.1:5053:53/udp"

[paths]
app_support = "~/Library/Application Support/Adputate"

[volumes]
etc_pihole = "adputate-etc-pihole"
etc_dnsmasq = "adputate-etc-dnsmasq.d"

[nebula_sync]
image = "ghcr.io/lovelaze/nebula-sync:v0.11.2"
env_example = "containers/nebula-sync.env.example"
mode = "primary-to-local-replica"
